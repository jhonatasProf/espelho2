<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espelho PIN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<main id="menu">
  <h1>Espelho PIN</h1>
  <p class="dim">Escolha o papel deste aparelho.</p>
  <div class="row">
    <button onclick="go('#projetor')">Este é o projetor</button>
    <button class="sec" onclick="go('#enviar')">Quero enviar conteúdo</button>
  </div>
</main>

<div id="proj" hidden>
  <main>
    <div id="wait">
      <p class="dim">No celular, escaneie o QR code abaixo ou abra esta página e digite o PIN:</p>
      <div id="pin" aria-live="polite">······</div>
    </div>
    <div id="stage"></div>
    <div id="pend" aria-live="polite"></div>
    <div id="chips" class="row"></div>
    <div id="st">Gerando PIN…</div>
    <div class="row">
      <button class="sec" id="bFull">Tela cheia</button>
      <button class="sec" id="bSom">Ativar som</button>
      <button class="sec" id="bGrade">Ver todos em grade</button>
      <button class="sec" id="bLimpa">Limpar tela</button>
      <button class="sec" id="bNovo">Novo PIN</button>
      <label class="chk"><input type="checkbox" id="apr" checked> Exigir aprovação</label>
    </div>
    <div id="qrbox">
      <div id="qr"></div>
      <p class="dim">Aponte a câmera do celular para enviar conteúdo</p>
    </div>
  </main>
</div>

<main id="send" hidden>
  <h1>Enviar ao projetor</h1>
  <div class="stack" id="login">
    <div class="card">
      <label for="nome">Seu nome</label>
      <input id="nome" class="f" type="text" maxlength="30" autocomplete="given-name" placeholder="Ex.: Maria">
      <label for="pinIn">PIN mostrado no projetor</label>
      <input id="pinIn" class="f" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">
      <button id="bConn">Conectar</button>
    </div>
  </div>
  <div class="stack" id="acoes" hidden>
    <div class="card">
      <input id="file" type="file" accept="image/*,video/*,application/pdf,audio/*" hidden>
      <button id="bFile">Enviar arquivo</button>
    </div>
    <div class="card">
      <input id="deckIn" type="file" accept="application/pdf,image/*" multiple hidden>
      <button id="bDeck">Enviar slides (PDF ou imagens)</button>
      <div class="row">
        <button class="sec big" id="bPrev" aria-label="Slide anterior">‹</button>
        <span id="dinfo">- / -</span>
        <button class="sec big" id="bNext" aria-label="Próximo slide">›</button>
      </div>
      <div class="row">
        <input id="goN" class="f" type="number" min="1" style="width:110px" placeholder="Nº">
        <button class="sec" id="bGo">Ir para o slide</button>
      </div>
    </div>
    <div class="card">
      <label for="txt">Mensagem para o projetor</label>
      <textarea id="txt" class="f" rows="2" maxlength="300"></textarea>
      <button id="bTxt">Enviar mensagem</button>
      <label for="lnk">Link</label>
      <input id="lnk" class="f" type="url" placeholder="https://">
      <button id="bLnk">Enviar link</button>
    </div>
    <div class="card">
      <button id="bCam">Transmitir câmera</button>
      <button id="bFlip" class="sec">Trocar câmera (frente/trás)</button>
      <button id="bTela">Transmitir tela</button>
      <button id="bStop" class="sec" hidden>Parar transmissão</button>
      <button id="bSair" class="sec">Desconectar</button>
    </div>
  </div>
  <div id="progressBox" hidden><progress id="progress" max="100" value="0"></progress><div id="progressText" class="dim" aria-live="polite"></div></div>
  <div id="sst" aria-live="polite"></div>
</main>

<script src="./js/app.js"></script>
</body>
</html>
